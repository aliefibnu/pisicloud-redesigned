<section
  class="w-full bg-[#255247] text-white overflow-hidden relative"
  aria-labelledby="interested-heading"
>
  <div class="max-w-7xl mx-auto px-6 sm:px-8 lg:px-12 pt-12 sm:pt-16 lg:pt-20 pb-0">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-6 items-end">
      <div class="lg:col-span-7 flex flex-col justify-center pb-12 sm:pb-16 lg:pb-20">
        <div class="mb-6 sm:mb-8">
          <img
            ngSrc="/sample/logo pisi interested.png"
            width="193"
            height="43"
            alt="PISICloud Logo"
            class="h-9 sm:h-10 w-auto object-contain select-none"
          />
        </div>

        <h2
          id="interested-heading"
          class="text-3xl sm:text-4xl lg:text-5xl font-bold text-white tracking-tight leading-tight mb-4"
        >
          Interested in PISICloud?
        </h2>

        <div
          class="text-emerald-50/90 text-base sm:text-lg leading-relaxed max-w-xl mb-8 space-y-1 font-normal"
        >
          <p class="font-medium text-white">Interested In PISICloud?</p>
          <p>
            Transforming Your Workplace with PISICloud's Streamlined HR Processes. Contact the
            contact below for more info.
          </p>
        </div>

        <ul class="space-y-4 mb-10" aria-label="Contact Channels">
          <li>
            <a
              href="https://wa.me/627784160250"
              target="_blank"
              rel="noopener noreferrer"
              class="inline-flex items-center gap-4 text-white hover:text-emerald-200 transition-colors text-base sm:text-lg font-medium group focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-300 rounded-md p-1 -m-1"
            >
              <ng-icon
                name="bootstrapWhatsapp"
                class="text-2xl text-white group-hover:scale-110 transition-transform shrink-0"
                aria-hidden="true"
              />
              <span>(+62) 778 416 0250</span>
            </a>
          </li>

          <li>
            <a
              href="tel:+628117774744"
              class="inline-flex items-center gap-4 text-white hover:text-emerald-200 transition-colors text-base sm:text-lg font-medium group focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-300 rounded-md p-1 -m-1"
            >
              <ng-icon
                name="bootstrapTelephone"
                class="text-2xl text-white group-hover:scale-110 transition-transform shrink-0"
                aria-hidden="true"
              />
              <span>(+62) 811 7774 744</span>
            </a>
          </li>

          <li>
            <a
              href="mailto:hello@inforsys.co.id"
              class="inline-flex items-center gap-4 text-white hover:text-emerald-200 transition-colors text-base sm:text-lg font-medium group focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-300 rounded-md p-1 -m-1"
            >
              <ng-icon
                name="bootstrapEnvelope"
                class="text-2xl text-white group-hover:scale-110 transition-transform shrink-0"
                aria-hidden="true"
              />
              <span>hello&#64;inforsys.co.id</span>
            </a>
          </li>
        </ul>

        <div class="flex flex-wrap items-center gap-4 sm:gap-5">
          <a
            mat-flat-button
            href="https://wa.me/627784160250"
            target="_blank"
            rel="noopener noreferrer"
            class="bg-white! text-[#255247]! hover:bg-emerald-50! active:bg-emerald-100! rounded-full! px-7! py-3.5! h-auto! font-semibold! text-base! shadow-md! transition-all duration-200 hover:shadow-lg! flex items-center gap-2.5"
          >
            <span class="flex items-center gap-2.5 justify-center">
              <ng-icon
                name="bootstrapTelephoneFill"
                class="text-lg text-[#255247]"
                aria-hidden="true"
              />
              <span>Contact Us</span>
            </span>
          </a>

          <a
            mat-flat-button
            href="tel:+628117774744"
            class="bg-[#1c433a]! text-white! hover:bg-[#173a32]! active:bg-[#12312a]! border! border-[#3d6e62]! rounded-full! px-7! py-3.5! h-auto! font-semibold! text-base! shadow-md! transition-all duration-200 hover:shadow-lg!"
          >
            <span class="flex items-center gap-2.5 justify-center">
              <ng-icon
                name="bootstrapTelephoneFill"
                class="text-lg text-white"
                aria-hidden="true"
              />
              <span>Contact Us</span>
            </span>
          </a>
        </div>
      </div>

      <div class="lg:col-span-5 flex justify-center lg:justify-end items-end h-full">
        <div
          class="relative w-full max-w-sm sm:max-w-md lg:max-w-lg xl:max-w-xl flex justify-center lg:justify-end items-end"
        >
          <img
            ngSrc="/sample/person interested.png"
            width="583"
            height="789"
            alt="PISICloud representative presenting the HR software solution on a laptop"
            class="w-full h-auto object-contain object-bottom select-none pointer-events-none drop-shadow-2xl"
          />
        </div>
      </div>
    </div>
  </div>
</section>
