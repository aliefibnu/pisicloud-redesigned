@if (variant() === 'desktop') {
  <div class="relative" data-nav-dropdown>
    <button
      type="button"
      (click)="toggleMenu()"
      class="group inline-flex items-center gap-2.5 px-4 py-2 rounded-full h-10 text-sm font-medium text-slate-700 hover:text-[#00382f] hover:bg-[#cde8e0] active:scale-[0.98] transition-all duration-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#066b60] cursor-pointer"
      [class.bg-[#cde8e0]]="isOpen()"
      [class.text-[#00382f]]="isOpen()"
      [attr.aria-expanded]="isOpen()"
      aria-haspopup="true"
      [attr.aria-label]="'UNIVERSAL.NAVBAR.ARIA.LANGUAGE_MENU' | translate"
    >
      <svg
        class="w-3.5 h-3.5 text-slate-700 group-hover:text-[#00382f] transition-transform duration-200 shrink-0"
        [class.rotate-180]="isOpen()"
        [class.text-[#00382f]]="isOpen()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
      <span class="tracking-wide">{{ selectedLanguage().name }}</span>
      <span class="text-base leading-none" aria-hidden="true">{{ selectedLanguage().flag }}</span>
    </button>

    @if (isOpen()) {
      <div
        class="absolute top-full left-1/2 -translate-x-1/2 mt-5 w-76.25 rounded-2xl bg-white border border-slate-200/90 shadow-xl shadow-slate-900/10 px-6 pt-5 pb-5 z-50 focus:outline-none animate-in fade-in zoom-in-95 duration-150"
        role="menu"
        aria-orientation="vertical"
      >
        <h3 class="text-base font-bold text-slate-800 tracking-tight">{{ 'UNIVERSAL.NAVBAR.LANGUAGES_LABEL' | translate }}</h3>

        <div class="border-b border-slate-200/80 my-3"></div>

        <div class="space-y-1" role="none">
          @for (lang of otherLanguages(); track lang.code) {
            <button
              type="button"
              (click)="selectLanguage(lang)"
              class="w-full text-left py-2 px-2.5 rounded-xl hover:bg-[#cde8e0] active:bg-[#b1ccc4] flex items-center gap-2.5 text-slate-700 hover:text-[#00382f] text-sm font-medium cursor-pointer transition-colors"
              role="menuitem"
            >
              <span>{{ lang.name }}</span>
              <span class="text-base leading-none" aria-hidden="true">{{ lang.flag }}</span>
            </button>
          }
        </div>
      </div>
    }
  </div>
} @else {
  <div class="space-y-2 px-1">
    <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">{{ 'UNIVERSAL.NAVBAR.LANGUAGES_LABEL' | translate }}</span>
    <div class="flex flex-wrap gap-1.5">
      @for (lang of languages; track lang.code) {
        <button
          type="button"
          (click)="selectLanguage(lang)"
          [class.bg-[#066b60]]="selectedLanguage().code === lang.code"
          [class.text-white]="selectedLanguage().code === lang.code"
          [class.bg-slate-200/70]="selectedLanguage().code !== lang.code"
          [class.text-slate-800]="selectedLanguage().code !== lang.code"
          [class.hover:bg-[#cde8e0]]="selectedLanguage().code !== lang.code"
          [class.hover:text-[#00382f]]="selectedLanguage().code !== lang.code"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium cursor-pointer transition-all active:scale-[0.98]"
        >
          <span>{{ lang.name }}</span>
          <span class="text-sm leading-none" aria-hidden="true">{{ lang.flag }}</span>
        </button>
      }
    </div>
  </div>
}
