@if (variant() === 'desktop') {
  <div class="relative" data-nav-dropdown>
    <!-- Trigger Button -->
    <button
      type="button"
      (click)="toggleMenu()"
      class="group inline-flex items-center gap-2.5 px-4 py-2 rounded-full h-10 text-sm font-medium text-slate-700 hover:text-[#00382f] hover:bg-[#cde8e0] active:scale-[0.98] transition-all duration-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#066b60] cursor-pointer"
      [class.bg-[#cde8e0]]="isOpen()"
      [class.text-[#00382f]]="isOpen()"
      [attr.aria-expanded]="isOpen()"
      aria-haspopup="true"
      aria-label="Features navigation menu"
    >
      <!-- Downward Chevron -->
      <svg
        class="w-3.5 h-3.5 text-slate-700 group-hover:text-[#00382f] transition-transform duration-200 shrink-0"
        [class.rotate-180]="isOpen()"
        [class.text-[#00382f]]="isOpen()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
      <span class="tracking-wide">Features</span>
    </button>

    <!-- Desktop Features Popover Dropdown (Layout removed for redesign) -->
    @if (isOpen()) {
      <!-- Redesigned desktop layout goes here -->
    }
  </div>
} @else {
  <!-- Mobile Drawer Accordion Variant -->
  <div class="w-full">
    <button
      type="button"
      (click)="toggleMobileAccordion()"
      class="flex items-center justify-between w-full px-4 py-3 rounded-full text-base font-medium text-slate-700 hover:text-[#066b60] hover:bg-slate-200/60 active:bg-slate-300/60 transition-colors"
      [attr.aria-expanded]="isMobileExpanded()"
    >
      <div class="flex items-center gap-3">
        <svg class="w-2 h-2 fill-slate-600" viewBox="0 0 6 8" aria-hidden="true">
          <polygon points="0,0 6,4 0,8" />
        </svg>
        <span>Features</span>
      </div>
      <svg
        class="w-4 h-4 text-slate-600 transition-transform duration-200"
        [class.rotate-180]="isMobileExpanded()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>

    @if (isMobileExpanded()) {
      <!-- Redesigned mobile layout goes here -->
    }
  </div>
}
