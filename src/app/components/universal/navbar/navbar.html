<header class="w-full bg-[#eef4f8] border-b border-slate-200/70 shadow-[0_1px_2px_rgba(0,0,0,0.03)] transition-colors">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-10 h-18 flex items-center justify-between">
    <!-- Brand Logo -->
    <a
      routerLink="/"
      (click)="closeMobileMenu()"
      class="flex items-center gap-2 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#066b60] focus-visible:ring-offset-2 rounded-lg p-1 transition-transform active:scale-[0.98]"
      aria-label="PisiCloud Home"
    >
      <img
        ngSrc="/images/PISICloud Logo.svg"
        alt="PisiCloud Logo"
        width="173"
        height="35"
        priority
        class="h-8 w-auto object-contain"
      />
    </a>

    <!-- Desktop Navigation Links (Material 3 Text/Tonal Interactive Targets) -->
    <nav class="hidden md:flex items-center gap-2 lg:gap-4" aria-label="Main navigation">
      @for (item of navItems; track item.label) {
        @if (item.route) {
          <a
            [routerLink]="item.route"
            class="group inline-flex items-center gap-2.5 px-4 py-2 rounded-full text-sm font-medium text-slate-700 hover:text-[#066b60] hover:bg-slate-200/50 active:bg-slate-300/60 transition-all duration-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#066b60]"
          >
            <!-- Right-pointing triangle indicator -->
            <svg
              class="w-2 h-2 fill-slate-600 group-hover:fill-[#066b60] transition-colors shrink-0"
              viewBox="0 0 6 8"
              aria-hidden="true"
            >
              <polygon points="0,0 6,4 0,8" />
            </svg>
            <span class="tracking-wide">{{ item.label }}</span>
          </a>
        } @else {
          <a
            [href]="item.href"
            class="group inline-flex items-center gap-2.5 px-4 py-2 rounded-full text-sm font-medium text-slate-700 hover:text-[#066b60] hover:bg-slate-200/50 active:bg-slate-300/60 transition-all duration-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#066b60]"
          >
            <svg
              class="w-2 h-2 fill-slate-600 group-hover:fill-[#066b60] transition-colors shrink-0"
              viewBox="0 0 6 8"
              aria-hidden="true"
            >
              <polygon points="0,0 6,4 0,8" />
            </svg>
            <span class="tracking-wide">{{ item.label }}</span>
          </a>
        }
      }

      <!-- Language Selector (Material 3 Menu) -->
      <div class="relative">
        <button
          type="button"
          (click)="toggleLanguageMenu()"
          class="group inline-flex items-center gap-2.5 px-4 py-2 rounded-full text-sm font-medium text-slate-700 hover:text-[#066b60] hover:bg-slate-200/50 active:bg-slate-300/60 transition-all duration-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#066b60] cursor-pointer"
          [attr.aria-expanded]="isLanguageMenuOpen()"
          aria-haspopup="true"
          aria-label="Select Language"
        >
          <svg
            class="w-2 h-2 fill-slate-600 group-hover:fill-[#066b60] transition-colors shrink-0"
            viewBox="0 0 6 8"
            aria-hidden="true"
          >
            <polygon points="0,0 6,4 0,8" />
          </svg>
          <span class="tracking-wide">{{ currentLanguage() }}</span>
          <span class="text-base leading-none" aria-hidden="true">
            @if (currentLanguage() === 'English') {
              🇬🇧
            } @else {
              🇮🇩
            }
          </span>
        </button>

        @if (isLanguageMenuOpen()) {
          <div
            class="absolute right-0 mt-2 w-52 rounded-2xl bg-white shadow-lg ring-1 ring-black/5 p-1.5 z-50 text-sm focus:outline-none animate-in fade-in zoom-in-95 duration-150"
            role="menu"
            aria-orientation="vertical"
          >
            <button
              type="button"
              (click)="setLanguage('English')"
              class="w-full text-left px-3.5 py-2.5 rounded-xl hover:bg-slate-100/80 active:bg-slate-200/80 flex items-center justify-between text-slate-700 font-medium cursor-pointer transition-colors"
              role="menuitem"
            >
              <span>English</span>
              <span>🇬🇧</span>
            </button>
            <button
              type="button"
              (click)="setLanguage('Bahasa Indonesia')"
              class="w-full text-left px-3.5 py-2.5 rounded-xl hover:bg-slate-100/80 active:bg-slate-200/80 flex items-center justify-between text-slate-700 font-medium cursor-pointer transition-colors"
              role="menuitem"
            >
              <span>Bahasa Indonesia</span>
              <span>🇮🇩</span>
            </button>
          </div>
        }
      </div>
    </nav>

    <!-- Right Side CTA Button (Material 3 Filled / Extended FAB Button) -->
    <div class="hidden md:flex items-center">
      <a
        href="#contact"
        class="inline-flex items-center gap-2.5 px-6 py-2.5 rounded-full bg-[#066b60] text-white text-sm font-medium tracking-wide shadow-sm hover:shadow-md hover:bg-[#05574e] active:shadow-none active:scale-[0.98] transition-all duration-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#066b60] focus-visible:ring-offset-2"
      >
        <svg
          class="w-4 h-4 fill-current shrink-0"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"
          />
        </svg>
        <span>Contact Us</span>
      </a>
    </div>

    <!-- Mobile Hamburger Toggle (Material 3 Icon Button) -->
    <div class="flex md:hidden">
      <button
        type="button"
        (click)="toggleMobileMenu()"
        class="p-2.5 rounded-full text-slate-700 hover:bg-slate-200/60 active:bg-slate-300/60 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#066b60] transition-colors cursor-pointer"
        [attr.aria-expanded]="isMobileMenuOpen()"
        aria-controls="mobile-menu"
        aria-label="Toggle navigation menu"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          @if (!isMobileMenuOpen()) {
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          } @else {
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          }
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Backdrop Overlay (Scrim) -->
  <div
    class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-40 transition-opacity duration-300 md:hidden"
    [class.opacity-100]="isMobileMenuOpen()"
    [class.pointer-events-auto]="isMobileMenuOpen()"
    [class.opacity-0]="!isMobileMenuOpen()"
    [class.pointer-events-none]="!isMobileMenuOpen()"
    (click)="closeMobileMenu()"
    aria-hidden="true"
  ></div>

  <!-- Mobile Slide-in Navigation Drawer (Sidebar) -->
  <aside
    id="mobile-sidebar"
    role="dialog"
    aria-modal="true"
    aria-label="Mobile Navigation Menu"
    class="fixed top-0 right-0 z-50 h-full w-72 sm:w-80 max-w-[85vw] bg-[#eef4f8] shadow-2xl border-l border-slate-200/70 transition-transform duration-300 ease-in-out flex flex-col justify-between p-6 md:hidden"
    [class.translate-x-0]="isMobileMenuOpen()"
    [class.translate-x-full]="!isMobileMenuOpen()"
  >
    <!-- Top: Drawer Header with Logo & Close Button -->
    <div>
      <div class="flex items-center justify-between pb-6 border-b border-slate-200/70">
        <a routerLink="/" (click)="closeMobileMenu()" aria-label="PisiCloud Home">
          <img
            ngSrc="/images/PISICloud Logo.svg"
            alt="PisiCloud Logo"
            width="140"
            height="28"
            class="h-7 w-auto object-contain"
          />
        </a>
        <button
          type="button"
          (click)="closeMobileMenu()"
          class="p-2 rounded-full text-slate-600 hover:text-slate-900 hover:bg-slate-200/60 active:bg-slate-300/60 transition-colors cursor-pointer"
          aria-label="Close navigation menu"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Middle: Vertical Navigation List -->
      <nav class="mt-6 space-y-1" aria-label="Mobile main navigation">
        @for (item of navItems; track item.label) {
          @if (item.route) {
            <a
              [routerLink]="item.route"
              (click)="closeMobileMenu()"
              class="flex items-center gap-3 px-4 py-3 rounded-full text-base font-medium text-slate-700 hover:text-[#066b60] hover:bg-slate-200/60 active:bg-slate-300/60 transition-colors"
            >
              <svg class="w-2 h-2 fill-slate-600" viewBox="0 0 6 8" aria-hidden="true">
                <polygon points="0,0 6,4 0,8" />
              </svg>
              <span>{{ item.label }}</span>
            </a>
          } @else {
            <a
              [href]="item.href"
              (click)="closeMobileMenu()"
              class="flex items-center gap-3 px-4 py-3 rounded-full text-base font-medium text-slate-700 hover:text-[#066b60] hover:bg-slate-200/60 active:bg-slate-300/60 transition-colors"
            >
              <svg class="w-2 h-2 fill-slate-600" viewBox="0 0 6 8" aria-hidden="true">
                <polygon points="0,0 6,4 0,8" />
              </svg>
              <span>{{ item.label }}</span>
            </a>
          }
        }
      </nav>
    </div>

    <!-- Bottom: Language Selector & CTA Button -->
    <div class="pt-6 border-t border-slate-200/70 space-y-5">
      <!-- Language Selector -->
      <div class="flex items-center justify-between px-1">
        <span class="text-sm font-medium text-slate-600">Language:</span>
        <div class="flex items-center gap-1 bg-slate-200/60 p-1 rounded-full">
          <button
            type="button"
            (click)="setLanguage('English')"
            [class.bg-white]="currentLanguage() === 'English'"
            [class.shadow-xs]="currentLanguage() === 'English'"
            [class.font-bold]="currentLanguage() === 'English'"
            class="text-xs text-slate-700 px-3 py-1.5 rounded-full cursor-pointer transition-all"
          >
            EN 🇬🇧
          </button>
          <button
            type="button"
            (click)="setLanguage('Bahasa Indonesia')"
            [class.bg-white]="currentLanguage() === 'Bahasa Indonesia'"
            [class.shadow-xs]="currentLanguage() === 'Bahasa Indonesia'"
            [class.font-bold]="currentLanguage() === 'Bahasa Indonesia'"
            class="text-xs text-slate-700 px-3 py-1.5 rounded-full cursor-pointer transition-all"
          >
            ID 🇮🇩
          </button>
        </div>
      </div>

      <!-- Contact Us Pill CTA -->
      <a
        href="#contact"
        (click)="closeMobileMenu()"
        class="w-full flex items-center justify-center gap-2.5 px-6 py-3.5 rounded-full bg-[#066b60] text-white text-sm font-medium tracking-wide shadow-sm hover:shadow-md hover:bg-[#05574e] transition-all active:scale-[0.98]"
      >
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"
          />
        </svg>
        <span>Contact Us</span>
      </a>
    </div>
  </aside>
</header>
