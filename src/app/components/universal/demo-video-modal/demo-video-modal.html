<div
  [class]="`z-20 fixed top-0 left-0 w-screen h-screen overflow-hidden bg-black/20 items-center justify-center ${display()}`"
  (click)="modalClick($event)"
>
  <div
    class="fixed top-10 right-10 text-white text-4xl cursor-pointer transition-all duration-300 hover:text-green-400 hover:scale-110"
    (click)="modalService.hideModal()"
  >
    <ng-icon name="bootstrapXCircle" />
  </div>
  <div class="w-[70%]">
    <video-player>
      <video-skin>
        <video
          src="https://stream.mux.com/BV3YZtogl89mg9VcNBhhnHm02Y34zI1nlMuMQfAbl3dM/highest.mp4"
          playsinline
        ></video>
      </video-skin>
    </video-player>
  </div>
</div>
