@if (modalService.isVisible()) {
  <div
    role="dialog"
    aria-modal="true"
    aria-label="Demo Video"
    class="z-100 fixed inset-0 w-screen h-screen flex items-center justify-center p-4 sm:p-6 md:p-8 transition-opacity duration-300 ease-out"
    [class.opacity-100]="modalService.isOpen()"
    [class.opacity-0]="!modalService.isOpen()"
    [class.pointer-events-auto]="modalService.isOpen()"
    [class.pointer-events-none]="!modalService.isOpen()"
    (click)="modalClick($event)"
  >
    <div
      class="absolute inset-0 bg-black/75 backdrop-blur-md transition-opacity duration-300 ease-out"
      [class.opacity-100]="modalService.isOpen()"
      [class.opacity-0]="!modalService.isOpen()"
      aria-hidden="true"
    ></div>

    <button
      type="button"
      aria-label="Close modal"
      class="fixed top-4 right-4 sm:top-6 sm:right-6 md:top-8 md:right-8 z-110 flex items-center justify-center w-11 h-11 rounded-full bg-white/10 hover:bg-white/20 text-white/90 hover:text-white backdrop-blur-md border border-white/20 shadow-lg cursor-pointer transition-all duration-300 hover:scale-110 hover:rotate-90 active:scale-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400"
      (click)="closeModal()"
    >
      <ng-icon name="bootstrapX" class="text-2xl sm:text-3xl" />
    </button>

    <div
      class="relative z-10 w-full max-w-5xl rounded-2xl overflow-hidden bg-slate-950 border border-white/15 shadow-2xl transition-all duration-300 ease-out"
      [class.scale-100]="modalService.isOpen()"
      [class.translate-y-0]="modalService.isOpen()"
      [class.opacity-100]="modalService.isOpen()"
      [class.scale-95]="!modalService.isOpen()"
      [class.translate-y-4]="!modalService.isOpen()"
      [class.opacity-0]="!modalService.isOpen()"
      (click)="$event.stopPropagation()"
    >
      <video-player class="w-full aspect-video block">
        <video-skin class="w-full h-full block">
          <video
            #videoPlayer
            src="https://stream.mux.com/BV3YZtogl89mg9VcNBhhnHm02Y34zI1nlMuMQfAbl3dM/highest.mp4"
            playsinline
            controls
            class="w-full h-full object-contain rounded-2xl"
          ></video>
        </video-skin>
      </video-player>
    </div>
  </div>
}
