<section class="max-w-4xl mx-auto my-16 px-4 font-sans text-center">
  <h2 class="text-4xl md:text-5xl font-bold text-gray-900 mb-12 leading-tight">
    {{ 'UNIVERSAL.FAQ.TITLE_LINE_1' | translate }}<br>
    {{ 'UNIVERSAL.FAQ.TITLE_LINE_2' | translate }} <span class="text-[#0b6953]">{{ 'UNIVERSAL.FAQ.TITLE_HIGHLIGHT' | translate }}</span>
  </h2>

  <div class="flex flex-col gap-4">
    @for (item of faqList; track $index; let i = $index) {
      <div
        class="border border-gray-200 rounded-[30px] p-6 bg-white transition-all duration-300 text-left"
        [class.border-[#0b6953]]="openIndex() === i"
        [class.shadow-sm]="openIndex() === i">

        <div class="flex justify-between items-center cursor-pointer select-none" (click)="toggleFaq(i)">
          <p class="text-gray-700 text-base md:text-lg font-normal m-0 pr-4">
            {{ item.questionKey | translate }}
          </p>

          <button
            type="button"
            (click)="toggleFaq(i); $event.stopPropagation()"
            class="w-10 h-10 rounded-full bg-[#0b6953] flex items-center justify-center shrink-0 border-none cursor-pointer"
            [attr.aria-expanded]="openIndex() === i"
            aria-label="Toggle accordion">

            <div
              class="relative w-3.5 h-3.5 flex items-center justify-center transition-transform duration-300 ease-in-out"
              [class.rotate-45]="openIndex() === i">
              <span class="absolute w-3.5 h-0.5 bg-white rounded-full"></span>
              <span class="absolute w-0.5 h-3.5 bg-white rounded-full"></span>
            </div>
          </button>
        </div>

        <div
          class="grid transition-[grid-template-rows] duration-300 ease-in-out"
          [class]="openIndex() === i ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]'">
          <div class="overflow-hidden">
            <div
              class="mt-4 transition-opacity duration-300"
              [class.opacity-100]="openIndex() === i"
              [class.delay-100]="openIndex() === i"
              [class.opacity-0]="openIndex() !== i">
              <p class="text-gray-500 text-sm md:text-base leading-relaxed m-0">
                {{ item.answerKey | translate }}
              </p>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</section>
