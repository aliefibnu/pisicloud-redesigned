<section
  class="hero-gradient relative w-full overflow-hidden"
  aria-labelledby="hero-heading"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-10 py-12 sm:py-16 md:py-20 lg:py-24 flex items-center">
    <div class="w-full grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-8 xl:gap-12 items-center">
      <!-- Left Column: Headlines & Call-to-Actions -->
      <div class="lg:col-span-7 xl:col-span-7 flex flex-col justify-center text-left z-10">
        <h1
          id="hero-heading"
          class="text-2xl sm:text-3xl md:text-4xl lg:text-[38px] xl:text-[46px] 2xl:text-[52px] font-bold text-[#2a302e] tracking-tight leading-[1.18] mb-5 sm:mb-6"
        >
          <span class="block whitespace-nowrap">{{ 'LANDING.HERO.TITLE_LINE_1' | translate }}</span>
          <span class="block whitespace-nowrap">
            <span>{{ 'LANDING.HERO.TITLE_LINE_2_PREFIX' | translate }}</span>
            <span class="text-[#076657]">{{ 'LANDING.HERO.BRAND' | translate }}</span>
            <span>{{ 'LANDING.HERO.TITLE_LINE_2_SUFFIX' | translate }}</span>
          </span>
        </h1>

        <p
          class="text-base sm:text-lg lg:text-xl text-[#444846] leading-relaxed max-w-xl mb-8 sm:mb-10 font-normal"
        >
          {{ 'LANDING.HERO.DESCRIPTION' | translate }}
        </p>

        <div class="flex flex-wrap items-center gap-3.5 sm:gap-4.5">
          <a
            href="#contact"
            class="inline-flex items-center justify-center gap-2.5 px-7 sm:px-8 py-3.5 rounded-full bg-[#076657] hover:bg-[#055145] text-white font-medium text-sm sm:text-base tracking-wide shadow-xs hover:shadow-md active:scale-95 transition-all duration-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#076657] focus-visible:ring-offset-2"
            [attr.aria-label]="'LANDING.HERO.CONTACT_US' | translate"
          >
            <svg
              class="w-4 h-4 fill-current shrink-0"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"
              />
            </svg>
            <span>{{ 'LANDING.HERO.CONTACT_US' | translate }}</span>
          </a>

          <button
            type="button"
            (click)="openPreviewModal()"
            class="group inline-flex items-center justify-center gap-2.5 px-6 sm:px-7 py-3.5 rounded-full bg-white/40 hover:bg-white/80 border border-[#076657] text-[#076657] font-medium text-sm sm:text-base tracking-wide shadow-xs hover:shadow-md active:scale-95 transition-all duration-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#076657] focus-visible:ring-offset-2 cursor-pointer"
            [attr.aria-label]="'LANDING.HERO.WATCH_PREVIEW' | translate"
          >
            <svg
              class="w-4 h-4 text-[#076657] fill-current shrink-0 transition-transform duration-200 group-hover:scale-110"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <polygon points="6 3 20 12 6 21 6 3"></polygon>
            </svg>
            <span>{{ 'LANDING.HERO.WATCH_PREVIEW' | translate }}</span>
          </button>
        </div>
      </div>

      <!-- Right Column: 3D Tablet Graphic -->
      <div class="lg:col-span-5 xl:col-span-5 flex items-center justify-center lg:justify-end relative mt-6 lg:mt-0">
        <div class="relative w-full max-w-lg lg:max-w-none flex items-center justify-center">
          <img
            ngSrc="/images/landing/hero-image.png"
            width="1398"
            height="1125"
            priority
            [alt]="'LANDING.HERO.IMAGE_ALT' | translate"
            class="w-full h-auto object-contain select-none pointer-events-none drop-shadow-xl transition-transform duration-500 hover:scale-[1.02]"
          />
        </div>
      </div>
    </div>
  </div>

  <landing-companies-marquee />
</section>
