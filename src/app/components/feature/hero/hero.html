<section
  class="w-full pt-10 sm:pt-14 md:pt-18 lg:pt-20 pb-8 sm:pb-12 md:pb-14 overflow-hidden"
  aria-labelledby="feature-hero-heading"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 xl:gap-16 items-center">
      <!-- Left Column (Desktop) / Bottom Column (Mobile): Feature UI Preview Mockup -->
      <div
        class="order-2 lg:order-1 lg:col-span-6 xl:col-span-7 flex items-center justify-center lg:justify-start"
      >
        <div
          class="w-full max-w-lg lg:max-w-none rounded-xl sm:rounded-2xl border border-slate-200/90 shadow-md bg-white overflow-hidden transition-shadow duration-300 hover:shadow-lg"
        >
          <img
            [ngSrc]="resolvedImage()"
            [alt]="imageAlt() | translate"
            width="360"
            height="251"
            priority
            draggable="false"
            class="w-full h-auto object-contain select-none bg-white"
          />
        </div>
      </div>

      <!-- Right Column (Desktop) / Top Column (Mobile): Title and Description -->
      <div
        class="order-1 lg:order-2 lg:col-span-6 xl:col-span-5 flex flex-col justify-center text-left"
      >
        <h1
          id="feature-hero-heading"
          class="text-3xl sm:text-4xl lg:text-5xl font-bold text-slate-900 tracking-tight leading-[1.15] mb-4 sm:mb-6"
        >
          {{ resolvedTitleKey() | translate }}
        </h1>

        <p class="text-base sm:text-lg lg:text-[19px] text-slate-600 leading-relaxed font-normal">
          @if (resolvedTaglineKey() && resolvedTaglineKey() !== resolvedTitleKey()) {
            <span class="text-slate-700 font-medium">{{ resolvedTaglineKey() | translate }} </span>
          }
          <span>{{ resolvedDescKey() | translate }}</span>
        </p>
      </div>
    </div>
  </div>
</section>
