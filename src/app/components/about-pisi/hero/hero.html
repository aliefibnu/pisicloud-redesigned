<section class="relative w-full overflow-hidden pt-10 sm:pt-14 md:pt-18 pb-8 sm:pb-12 md:pb-16 font-sans bg-white">
  <!-- Text Header Container -->
  <div class="max-w-4xl mx-auto px-4 sm:px-6 text-center mb-6 sm:mb-8 md:mb-12">
    <!-- Headline with full i18n support -->
    <h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-[56px] font-bold text-[#1f2937] tracking-tight leading-[1.18] mb-4 sm:mb-5">
      <span>{{ 'ABOUT_PISI.HERO.TITLE_PREFIX' | translate }}</span>
      <span class="text-[#076657]">{{ 'ABOUT_PISI.HERO.TITLE_STRONG' | translate }}</span>
      <span>{{ 'ABOUT_PISI.HERO.TITLE_MIDDLE' | translate }}</span><br class="hidden sm:inline">
      <span class="text-[#076657]">{{ 'ABOUT_PISI.HERO.TITLE_AFFORDABLE' | translate }}</span>
    </h1>

    <!-- Subtitle -->
    <p class="text-sm sm:text-base md:text-lg text-gray-600 leading-relaxed font-normal max-w-2xl mx-auto px-2 sm:px-4">
      {{ 'ABOUT_PISI.HERO.DESCRIPTION' | translate }}
    </p>
  </div>

  <!-- Device Mockup Showcase: Pure device mockup without background screenshot -->
  <div class="w-full px-4 sm:px-6 flex justify-center select-none">
    <div class="relative w-full max-w-md md:max-w-2xl lg:max-w-3xl flex items-center justify-center">
      <img
        ngSrc="/images/about-pisi/hero-devices.webp"
        [alt]="'ABOUT_PISI.HERO.ALT_DEVICES' | translate"
        width="635"
        height="455"
        priority
        draggable="false"
        (dragstart)="$event.preventDefault()"
        class="w-full h-auto object-contain select-none drop-shadow-2xl transition-transform duration-500 hover:scale-[1.02]"
      />
    </div>
  </div>
</section>
