    <style>
      .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(190, 201, 194, 0.3);
        box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          border-color 0.2s ease;
      }
      .glass-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px -4px rgba(0, 89, 68, 0.08);
        border-color: rgba(0, 89, 68, 0.2);
      }
      .material-symbols-outlined {
        font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
      }
      .marquee-container {
        overflow: hidden;
        white-space: nowrap;
        position: relative;
        width: 100%;
        padding-bottom: 2rem;
        padding-top: 1rem;
      }

      .marquee-content {
        display: inline-flex;
        animation: marquee 30s linear infinite;
      }

      .marquee-content:hover {
        animation-play-state: paused;
      }

      @keyframes marquee {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-50%);
        } /* Assuming content is duplicated for smooth loop */
      }

      /* Ambient subtle shadow for cards */
      .ambient-shadow {
        box-shadow:
          0 10px 30px -5px rgba(0, 89, 68, 0.05),
          0 5px 15px -10px rgba(0, 89, 68, 0.03);
      }
    </style>

  <body class="bg-background min-h-screen font-body-md text-on-background">
